<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="stylesheet.css">
    <script src="scriptRegistro.js" defer></script>
    <title>Registro de Usuario - Zonalibros</title>
</head>
<body class="bg-light min-vh-100 d-flex flex-column">

    <header class="bg-body-tertiary border-bottom py-3">
        <div class="container-fluid px-4">
            <div class="row align-items-center">
                <div class="col-4 text-start">
                    <a href="#" class="text-dark text-decoration-none fw-bold">HOME</a>
                </div>
                <div class="col-4 text-center">
                    <h1 class="h3 m-0 fw-bold tracking-wide">ZONALIBROS</h1>
                </div>
                <div class="col-4 text-end">
                    <a href="login.html" class="btn btn-dark text-uppercase px-3 fw-bold">INICIAR SESIÓN</a>
                </div>
            </div>
        </div>
    </header>

    <main class="container flex-grow-1 d-flex justify-content-center align-items-center my-5">
        <div class="card border-dark shadow-sm" style="width: 100%; max-width: 550px;">
            <div class="card-header bg-secondary-subtle border-bottom border-dark py-2">
                <span class="fw-bold text-lowercase fs-6 ms-2">Registro de usuario</span>
            </div>
            
            <div class="card-body p-4">
                <div id="mensajeError"></div>

                <form id="formRegistro">
                    <div class="mb-3">
                        <label for="nombre" class="form-label fw-bold text-uppercase small">NOMBRE COMPLETO</label>
                        <input type="text" class="form-control border-dark" id="nombre" name="nombre" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-bold text-uppercase small">CORREO</label>
                        <input type="email" class="form-control border-dark" id="email" name="email" required>
                    </div>

                    <div class="mb-3">
                        <label for="emailRepetir" class="form-label fw-bold text-uppercase small">CONFIRMAR CORREO</label>
                        <input type="email" class="form-control border-dark" id="emailRepetir" name="emailRepetir" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label fw-bold text-uppercase small">CONTRASEÑA</label>
                        <input type="password" class="form-control border-dark" id="contraseña" name="contraseña" required>
                    </div>

                    <div class="mb-3">
                        <label for="confirmarPassword" class="form-label fw-bold text-uppercase small">CONFIRMAR CONTRASEÑA</label>
                        <input type="password" class="form-control border-dark" id="contraseñaRepetir" name="contraseñaRepetir" required>
                    </div>

                    <div class="mb-4">
                        <label for="telefono" class="form-label fw-bold text-uppercase small">TELÉFONO (opcional)</label>
                        <input type="tel" class="form-control border-dark" id="telefono" name="telefono">
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-uppercase small">TIPO DE GÉNERO</label>
                        <div class="border border-dark p-3 bg-white">
                            <div class="row">

                                <div class="col-6 d-flex flex-column gap-2">
                                    <div class="form-check">
                                        <input class="form-check-input border-dark" type="checkbox" id="ficcion" name="genero" value="ficcion">
                                        <label class="form-check-label fw-semibold text-uppercase small" for="ficcion">FICCIÓN</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input border-dark" type="checkbox" id="misterio" name="genero" value="misterio">
                                        <label class="form-check-label fw-semibold text-uppercase small" for="misterio">MISTERIO</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input border-dark" type="checkbox" id="fantasia" name="genero" value="fantasia">
                                        <label class="form-check-label fw-semibold text-uppercase small" for="fantasia">FANTASÍA</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input border-dark" type="checkbox" id="cienciaFiccion" name="genero" value="cienciaFiccion">
                                        <label class="form-check-label fw-semibold text-uppercase small" for="cienciaFiccion">CIENCIA FICCIÓN</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input border-dark" type="checkbox" id="romance" name="genero" value="romance">
                                        <label class="form-check-label fw-semibold text-uppercase small" for="romance">ROMANCE</label>
                                    </div>
                                </div>

                                <div class="col-6 d-flex flex-column gap-2">
                                    <div class="form-check">
                                        <input class="form-check-input border-dark" type="checkbox" id="terror" name="genero" value="terror">
                                        <label class="form-check-label fw-semibold text-uppercase small" for="terror">TERROR</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input border-dark" type="checkbox" id="historico" name="genero" value="historico">
                                        <label class="form-check-label fw-semibold text-uppercase small" for="historico">HISTÓRICO</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input border-dark" type="checkbox" id="aventura" name="genero" value="aventura">
                                        <label class="form-check-label fw-semibold text-uppercase small" for="aventura">AVENTURA</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input border-dark" type="checkbox" id="biografia" name="genero" value="biografia">
                                        <label class="form-check-label fw-semibold text-uppercase small" for="biografia">BIOGRAFÍA</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="text-center pt-2">
                        <button type="submit" class="btn btn-outline-dark px-4 py-2 border-2 text-uppercase fw-bold">REGISTRAR</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
